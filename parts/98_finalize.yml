
  # after all kits
  - name: A7-MultiKits
    description: Multiclass Kits
    overview: |
      With this mod it is possible to install true multiclass kits from any combination of single-class kits,
      which allows unusual combinations such as Kensai/Assassin or Berserker/Wild Mage/Swashbuckler.
      Custom kits from mods are considered as well if detected.
    components:
      - 200 # User-defined multiclass kits (via A7-MultiKits.ini)
    location:
      github_user: Argent77
      repository: A7-MultiKits
      branch: devel
      refresh: 7days
      patches:
        - relative: patches/eet/a7_multikits_configure.diff
